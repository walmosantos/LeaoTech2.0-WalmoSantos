<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula04</title>
</head>
<body>

    <h2>Form de candidatura</h2>
    <form action="">
        <label for="nome">Nome</label>
        <input type="text" name="nome" id= "nome" placeholder="Escreva seu nome"> <br> <br>

        <label for="email">Email</label>
        <input type="email"  name="email" id="email" placeholder="Escreva seu email"> <br><br>

        <label for="cargo">Cargo de tecnologia</label>
        <select name="cargo" id="cargo">
            <option value="">----selecione----</option>
            <option value="c1">Analista de qualidade</option>
            <option value="c2">Analista de dados</option>
            <option value="c3">Técnico de Hardware</option>
        </select>

        <label for="">Genero</label>

        <input type="radio" name="genero" value="m" id="m">
        <label for="m">Masculino</label>

        <input type="radio" name="genero" value="f" id="f">
        <label for="f">Feminino</label>

        <input type="radio" name="genero" value="o" id="o">
        <label for="o">Outro</label> <br><br>


        <label for="">Unidade de interesse</label>

        <input type="checkbox" name="unidade" id="fortaleza" value="fortaleza">
        <label for="fortaleza">fortaleza</label>
         <input type="checkbox" name="unidade" id="caucaia" value="caucaia">
        <label for="fortaleza">Caucaia</label>
         <input type="checkbox" name="unidade" id="eusebio" value="eusebio">
        <label for="fortaleza">Eusebio</label> <br><br>

        <label for="">Fale mais sobre você</label><br>
        <textarea cols="50" name="comentario" id="comentario">

        </textarea>



        <br><br>
        <input type="submit" value="Enviar">
    </form>

</body>
</html>
