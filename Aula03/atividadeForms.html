<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <form>
    <label for="Nome">Nome:</label> <br>
    <input type="text" id="Nome" name="nome" required placeholder="Digite seu nome"> 
     <br>
     <br>   
    <label for="Email">Email:</label> <br>
    <input type="text" id="Email" name="email" required placeholder="Digite seu email">
     <br>
     <br>   
    <label for="Senha">Senha:</label> <br>
    <input type="text" id="Senha" name="Senha" required placeholder="Digite sua senha">
     <br>
     <br>   
    <label for="Idade">Idade: </label> <br>
    <input type="number" id="Idade" name="Idade" required placeholder="Digite sua idade"> <br> <br> <br>

    <input type="button" value="Enviar"> 
    </form>   
</body>
</html>
