<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 12 - Operadores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


    <style>
        .caixa{
            width: 150px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        div form label  {
            color: red;
        }
    </style>

</head>

<body style="margin-bottom: 500px;" onload="eventosTela('carregou')" onscroll="eventosTela('scroll')" onresize="eventosTela('redimensionado')">
    <h1>Aula de Eventos e DOM</h1>
    <div id="caixa1" onclick="enviarMsg('unico')" onmouseout="enviarMsg('out')" class="bg-danger text-bg-light caixa ms-1">
        <p>Caixa 1</p>
    </div>

    <div id="caixa2" ondblclick="enviarMsg('duplo')" class="bg-success text-bg-light caixa ms-1 mt-1">
        <p>Caixa 2</p>
    </div>

    <div id="caixa3" onmouseover="enviarMsg('over')" class="bg-warning text-bg-light caixa ms-1 mt-1">
        <p>Caixa 3</p>
    </div>

    <div class="mt-3 border border-dark p-3 w-75">
        <h2 name="titulo">Eventos de teclado</h2>
        <form  onsubmit="enviarFormulario(event)" action="" method="get">
            <label for="nome">Nome:</label>
            <input onkeydown="apertouTecla ('keydown')"  id= "nome" type="text">
            <br>
            <label for="nome">Email:</label>
            <input onkeyup="apertouTecla ('keydown')" onfocus="eventoFormulario ('foco')"  id= "nome" type="text">
            
            <label for="telefone">Telefone:</label>
            <input oninput= "eventoFormulario ('input')"  id= "telefone" type="text">

            <label for="telefone">Profissao:</label>
            <input onchange= "eventoFormulario ('change')"  id= "profisssao" type="text">
            <br>
            <input  type="submit" value="Enviar">
        </form>
        </form>
    </div>

    <div class="mt-5 ms-2">
        <button onclick="funcao1()" class="ms-2 btn btn-success">Click aqui</button>
    </div>

    <div class="mt-5">
        <label for=""></label>
        <input type="text">
    </div>

    <div class="mt-2">
        <label for="cidade"></label>
        <input id= "cidade 
        "type="text">
    </div>



</body>
<script>
    console.log(document.getElementById('caixa1'))

    console.log(document.getElementsByClassName('caixa')[2])

    console.log(document.getElementsByName('titulo'))

    //selecionar por seletor de css

    console.log(document.querySelector('.caixa'))

    console.log(document.querySelectorAll('div form label'))

    //alterar conteudo

    caixa1.innerHTML = '<h1>Box1</h1>'
    console.log(caixa1.innerHTML)
    


    //objeto
    function funcao1() {
        let pessoa = {
            //atributos abaixo
            nome: 'Joao',
            idade: 25,
            //metodos abaixo "tipo poo"
            falar: function() {
                console.log(`meu nome é ${this.nome}`)
            }
        }
        console.log(pessoa.nome)
        let lista = [1,552,525,5,12,5]

        lista.forEach
        //mostra o tamanho do atributo
        lista.length
    }

    function eventosTela(tipo) {
        if (tipo == 'carregou') {
            console.log('tela carregada');
        } else if (tipo == 'scroll') {
            console.log('tela desceu');
        } else if (tipo == 'redimensionado') {
            console.log('tela mudou de tamanho');
            
        }
    }

    function enviarFormulario (e) {
        e.preventDefault()
        console.log('evento do submit');
    }

    function eventoFormulario (tipo) {
        if (tipo == 'foco') {
            console.log('Elemento com foco');
        } else if (tipo == 'input') {
            console.log('elemento recebeu dados');
        } else if (tipo == 'change') {
            console.log('elemento mudou');
        }
    }


    function apertouTecla (tipo) {
        if (tipo == 'keydown') {
            alert('tecla pressionada')
        }
        if (tipo == 'keyup') {
            alert('tecla keyup')
        }
    }

    function enviarMsg(tipo){
        if (tipo == 'unico'){
            alert('Click único')
        }else if (tipo == 'duplo'){
            alert('Click dúplo')
        }else if (tipo == 'over'){
            alert('mouse over')
        }else if(tipo == 'out'){
            alert('mouse out')
        }
    }

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</html>
